version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: always
    environment:
      # Assuming default Spring boot profile for Docker, if needed.
      - SPRING_PROFILES_ACTIVE=prod
